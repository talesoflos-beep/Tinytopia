/* --- lore tree modal: §10.3 hub-and-fans, positions computed from constants --- */
el("btnTech").onclick=buildTechModal;
let selTech=null;
function techNodePositions(){
  const CX=300,CY=300,R1=100,R2=185,R3=262,SPREAD=25*Math.PI/180;
  const P={};
  for(const br in BRANCHES){
    const a=BRANCHES[br].angle*Math.PI/180;
    const ids=Object.keys(TECHS).filter(id=>TECHS[id].branch===br);
    const t1=ids.find(id=>TECHS[id].tier===1);
    P[t1]=[CX+Math.cos(a)*R1, CY+Math.sin(a)*R1];
    ids.filter(id=>TECHS[id].tier===2).forEach((id,i)=>{
      const aa=a+(i===0?-1:1)*SPREAD;                     // first-defined T2 = Harvest side
      P[id]=[CX+Math.cos(aa)*R2, CY+Math.sin(aa)*R2];
      const t3=ids.find(x=>TECHS[x].req===id);
      if(t3) P[t3]=[CX+Math.cos(aa)*R3, CY+Math.sin(aa)*R3];
    });
  }
  return P;
}
function buildTechModal(){
  const p=viewingPlayer();
  const P=techNodePositions();
  let edges="", nodes="";
  for(const id in TECHS){
    const [x,y]=P[id];
    const from=TECHS[id].req? P[TECHS[id].req] : [300,300];
    edges+=`<line x1="${from[0].toFixed(1)}" y1="${from[1].toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#c9a456" stroke-opacity=".4" stroke-width="2"/>`;
  }
  for(const id in TECHS){
    const t=TECHS[id], [x,y]=P[id];
    const owned=p.techs.has(id), avail=canResearch(viewIndex(),id), cost=techCost(viewIndex(),id);
    const fill= owned? "#ffd75e" : avail? "#2f3a63" : "#1b2138";
    const stroke= owned? "#c9a456" : avail? "#ffd75e" : "#3a4468";
    nodes+=`<g class="tnode" data-tech="${id}" opacity="${owned||avail?1:.55}" style="cursor:pointer">`;
    if(avail) nodes+=`<circle cx="${x}" cy="${y}" r="30" fill="none" stroke="#ffd75e" stroke-opacity=".28" stroke-width="7"/>`;
    if(t.flame) nodes+=`<circle cx="${x}" cy="${y}" r="32" fill="none" stroke="#ff9138" stroke-width="2.5" stroke-dasharray="4 3"/>`;
    if(selTech===id) nodes+=`<circle cx="${x}" cy="${y}" r="36" fill="none" stroke="#eef2f7" stroke-width="1.5"/>`;
    nodes+=`<circle cx="${x}" cy="${y}" r="24" fill="${fill}" stroke="${stroke}" stroke-width="2"/>
      <text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="19">${t.icon}</text>
      <text x="${x}" y="${y+40}" text-anchor="middle" font-size="12" font-weight="bold" fill="${owned?'#57d38c':(avail?'#ffd75e':'#5a648a')}">${owned?"✓":(avail?"📜"+cost:"🔒")}</text></g>`;
  }
  const hub=`<circle cx="300" cy="300" r="36" fill="#1c2542" stroke="#c9a456" stroke-width="2"/>
    <text x="300" y="293" text-anchor="middle" font-size="17">✦</text>
    <text x="300" y="309" text-anchor="middle" font-size="8.5" fill="#c9a456" letter-spacing="1">ANCESTRAL</text>
    <text x="300" y="319" text-anchor="middle" font-size="8.5" fill="#c9a456" letter-spacing="1">LORE</text>`;
  const html=`<svg viewBox="0 0 600 600" style="width:100%;display:block;max-height:56vh">${edges}${hub}${nodes}</svg>
    <div id="techDetail" style="min-height:48px;color:#8ea0b5;font-size:13px;line-height:1.4;margin-top:6px">Tap a lore node to read it.</div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:8px">
      <div style="font-weight:800;white-space:nowrap">📜 ${p.influence}</div>
      <button class="btn primary" id="techUnlock" style="flex:1" disabled>Unlock</button>
    </div>`;
  openModal("Lore","Four old ways fan out from the Ancestral Lore. Flame-ringed nodes are the Lantern Court's own.",html);
  el("mBody").querySelectorAll(".tnode").forEach(n=>{
    n.onclick=()=>{ selTech=n.dataset.tech; buildTechModal(); };
  });
  if(selTech && TECHS[selTech]){
    const t=TECHS[selTech], owned=p.techs.has(selTech), avail=canResearch(viewIndex(),selTech), cost=techCost(viewIndex(),selTech);
    el("techDetail").innerHTML=`<b style="color:#eef2f7">${t.icon} ${t.name}</b>`
      +(t.flame?` <span style="color:#ff9138">— Lantern Court flame lore</span>`:"")
      +`<br>${t.blurb}`
      +(owned?` <span style="color:#57d38c">(known)</span>`
        :(avail?"":`<br><span>needs ${TECHS[t.req].name}</span>`));
    const b=el("techUnlock");
    b.disabled=!(avail && p.influence>=cost);
    b.textContent= owned? "Known" : `Unlock — 📜${cost}`;
    if(avail && p.influence>=cost) b.onclick=()=>{ research(viewIndex(),selTech); };
  }
}

/* --- city modal (train units) --- */
function trainCost(city,d){ return Math.max(1, d.cost-(city.forge?1:0)); }   // Forgecraft (§10.1)
function openCity(city){
  const p=viewingPlayer();
  const occupied=unitAt(city.x,city.y);
  const built=Object.keys(BUILDINGS).filter(k=>city[k]);
  let html=`<div class="row" style="display:flex;gap:14px;color:#8ea0b5;font-size:12px;margin-bottom:8px;flex-wrap:wrap">
     <span>Level <b style="color:#eef2f7">${city.level}</b></span>
     <span>Listeners <b style="color:#eef2f7">${city.listeners}/${city.level+1}</b></span>
     <span>Income <b style="color:#ffd75e">📜${cityIncome(city)}</b></span>
     <span>Army <b style="color:#eef2f7">${G.units.filter(u=>u.owner===viewIndex()).length}/${armyCap(viewIndex())}</b></span>
     ${city.wall?'<span style="color:#ffd75e">Walled</span>':''}${city.capital?'<span style="color:#ffd75e">★Capital</span>':''}
     ${built.map(k=>`<span>${BUILDINGS[k].icon} ${BUILDINGS[k].name}</span>`).join("")}
   </div>`;
  if(occupied){
    html+=`<div class="d" style="color:#8ea0b5;margin-bottom:8px">Tile occupied — move the unit off before training a new one.</div>`;
  }
  if(!canFieldMore(viewIndex())){
    html+=`<div class="d" style="color:#8ea0b5;margin-bottom:8px">Army at capacity (§7.2: city level + 1 per city). Level cities up to field more.</div>`;
  }
  html+=`<div style="font-weight:800;color:#8ea0b5;font-size:12px;margin:6px 0">TRAIN</div><div class="grid">`;
  for(const key of Object.keys(UNITS)){
    const d=UNITS[key], cost=trainCost(city,d);
    const locked = d.tech && !p.techs.has(d.tech);
    const afford = p.influence>=cost && !occupied && canFieldMore(viewIndex());
    const cls = locked?"locked":(afford?"":"locked");
    html+=`<div class="card ${cls}" data-u="${key}">
      <div class="t"><span>${d.icon} ${d.name}</span><span class="cost">📜${cost}</span></div>
      <div class="d">ATK ${d.atk} · DEF ${d.def} · MOV ${d.move} · RNG ${d.range}${locked?`<br><span style="color:#8ea0b5">needs ${TECHS[d.tech].name}</span>`:''}</div>
    </div>`;
  }
  html+="</div>";
  // §10.1 tile-less lore buildings, one of each per city
  const options=Object.keys(BUILDINGS).filter(k=>p.techs.has(BUILDINGS[k].tech));
  if(options.length){
    html+=`<div style="font-weight:800;color:#8ea0b5;font-size:12px;margin:10px 0 6px">BUILD</div><div class="grid">`;
    for(const key of options){
      const b=BUILDINGS[key], done=!!city[key];
      const cls=done?"owned":(p.influence>=BUILD_COST?"":"locked");
      html+=`<div class="card ${cls}" data-b="${key}">
        <div class="t"><span>${b.icon} ${b.name}</span>${done?'<span class="pill" style="color:#57d38c">✓</span>':`<span class="cost">📜${BUILD_COST}</span>`}</div>
        <div class="d">${b.desc}</div>
      </div>`;
    }
    html+="</div>";
  }
  openModal((city.capital?"★ ":"")+"City", "", html);
  el("mBody").querySelectorAll(".card[data-u]").forEach(card=>{
    card.onclick=()=>{
      const key=card.dataset.u, d=UNITS[key], cost=trainCost(city,d);
      if(d.tech && !p.techs.has(d.tech)) return;
      if(unitAt(city.x,city.y)) return;
      if(p.influence<cost || !canFieldMore(viewIndex())) return;
      p.influence-=cost; spawnUnit(key,city.x,city.y,viewIndex());
      recomputeVision(viewIndex()); renderHUD(); el("scrim").classList.remove("on");
      toast(`Trained ${d.name}`);
    };
  });
  el("mBody").querySelectorAll(".card[data-b]").forEach(card=>{
    card.onclick=()=>{
      const key=card.dataset.b;
      if(city[key] || p.influence<BUILD_COST) return;
      p.influence-=BUILD_COST; city[key]=true;
      recomputeIncome(); recomputeVision(viewIndex()); renderHUD(); save();
      toast(`${BUILDINGS[key].name} built`);
      openCity(city);
    };
  });
}

/* --- §7.3 level-up reward ladder. Row = level reached − 1; row 5 repeats forever.
       L3(c) City Wall is the approved resolution of the walls-source gap; the L5+ (a)
       Legend-unit slot is deferred to slice 2 and stands in as +2 Influence/turn. --- */
function offerLevelReward(city){
  const row=Math.min(city.level-1,5);
  let opts;
  if(row<=1){
    const ok=canFieldMore(city.owner) && !unitAt(city.x,city.y);
    opts=[["+1 Influence/turn","Steady income from this city.","inc1"],
          ["Free Wanderer","The cheapest character, mustered here.","freeunit",!ok],
          ["Wandering Scout","Reveal ~25 tiles along a random path.","scout"]];
  } else if(row===2){
    const pool=Object.keys(TECHS).filter(id=>canResearch(city.owner,id));
    opts=[["Whispered Lore","Learn a random reachable lore node, free.","freelore",!pool.length],
          ["Kindle Charge","+1 use of the Lantern Court's special move.","kindle"],
          ["+1 Influence/turn","Steady income from this city.","inc1"]];
  } else if(row===3){
    opts=[ city.capital? ["Wellspring","+1 Listener/turn. (Capital only.)","wellspring"]
                       : ["Deep Listeners","+2 Listeners right now.","pop2"],
          ["Shrine","Defense bonus for units on this city tile.","shrine"],
          ["City Wall","×4 defense here; sieges take one extra turn.","wall",!!city.wall]];
  } else if(row===4){
    opts=[["Border Growth","Borders push out one tile (other folklores' land is skipped).","border"],
          ["+2 Influence/turn","Steady income from this city.","inc2"]];
  } else {
    opts=[["+250 Score","This city's tale grows famous.","score250"],
          ["+2 Influence/turn","Steady income from this city.","inc2"]];
  }
  const html=`<div class="grid">${opts.map(o=>`<div class="card ${o[3]?"locked":""}" data-r="${o[2]}"><div class="t">${o[0]}</div><div class="d">${o[1]}</div></div>`).join("")}</div>`;
  openModal(`${city.capital?"★ ":""}City reached level ${city.level}!`,"Choose a reward",html);
  el("mBody").querySelectorAll(".card").forEach(card=>{
    if(card.classList.contains("locked")) return;
    card.onclick=()=>{ applyReward(city,card.dataset.r); el("scrim").classList.remove("on"); };
  });
}
function applyReward(city,r){
  const p=G.players[city.owner];
  if(r==="inc1") city.bonusIncome=(city.bonusIncome||0)+1;
  else if(r==="inc2") city.bonusIncome=(city.bonusIncome||0)+2;
  else if(r==="freeunit"){
    if(canFieldMore(city.owner) && !unitAt(city.x,city.y)) spawnUnit("wanderer",city.x,city.y,city.owner);
    else p.influence+=2;
  }
  else if(r==="scout") scoutPath(city);
  else if(r==="freelore"){
    const pool=Object.keys(TECHS).filter(id=>canResearch(city.owner,id));
    if(pool.length){ const id=pool[ri(pool.length)]; p.techs.add(id);
      if(city.owner===0) toast(`Whispered lore: ${TECHS[id].name}`); }
  }
  else if(r==="kindle") p.kindle=(p.kindle||0)+1;
  else if(r==="wellspring") city.wellspring=true;
  else if(r==="pop2") addListeners(city,2);
  else if(r==="shrine") city.shrine=true;
  else if(r==="wall") city.wall=true;
  else if(r==="border"){ city.borderGrown=true; computeTerritory(city); }
  else if(r==="score250") city.park=(city.park||0)+250;
  recomputeIncome(); recomputeVision(city.owner); renderHUD(); renderActions();
}
// L1(c): a phantom scout wanders ~12 steps from the city, revealing as it goes (~25 tiles)
function scoutPath(city){
  const p=G.players[city.owner];
  let x=city.x, y=city.y, ang=rnd()*Math.PI*2;
  for(let s=0;s<12;s++){
    ang+=(rnd()-.5)*1.2;
    x=Math.max(0,Math.min(G.N-1,Math.round(x+Math.cos(ang))));
    y=Math.max(0,Math.min(G.N-1,Math.round(y+Math.sin(ang))));
    for(const[dx,dy]of NB8.concat([[0,0]])) if(inb(x+dx,y+dy)) p.revealed.add(idx(x+dx,y+dy));
  }
}

/* --- end screen --- */
function showEndScreen(won,byScore){
  const rows=G.players.map(p=>({name:p.name,color:p.color,score:computeScore(p),alive:p.alive}))
    .sort((a,b)=>b.score-a.score);
  const html=`
    <div class="center">
      <h1 style="font-size:30px">${won?"Victory!":"Defeat"}</h1>
      <p class="sub">${won?(byScore?`The ${G.winner!=null?G.players[G.winner].name:""} held the highest score.`:`The ${G.winner!=null?G.players[G.winner].name:""} tale is now the world's true tale.`):`“The tale of the ${G.players.find(p=>p.human).name} is no longer told.”`}</p>
      ${rows.map(r=>`<div class="field"><label style="color:${r.color}">${r.name}${r.alive?"":" ✝"}</label><b class="mono">${r.score}</b></div>`).join("")}
      <button class="btn primary" style="width:100%;margin-top:12px" id="againBtn">New game ▶</button>
    </div>`;
  openModal("","",html);
  el("mClose").style.display="none";
  el("againBtn").onclick=()=>{ el("mClose").style.display=""; el("scrim").classList.remove("on"); startScreen.classList.add("on"); };
}

/* ------------------------------ START SCREEN ----------------------------- */
const startScreen=el("startScreen");
let sel={folklore:"lantern_court",size:12,ai:1,mode:"dom",world:"heartlands",diff:"medium",humans:1};
function buildFolkGrid(){
  const g=el("folkGrid"); g.innerHTML="";
  FOLKLORES.forEach(t=>{
    const d=document.createElement("div"); d.className="folk"+(t.id===sel.folklore?" on":"");
    d.innerHTML=`<div class="dot" style="background:${t.color}"></div><div class="n">${t.name}</div><div class="s">${t.tagline}</div>`;
    d.onclick=()=>{ sel.folklore=t.id; buildFolkGrid(); };
    g.appendChild(d);
  });
}
function wireSeg(id,key,cast){
  el(id).querySelectorAll("button").forEach(b=>{
    b.onclick=()=>{ el(id).querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
      sel[key]=cast(b.dataset.v); };
  });
}
buildFolkGrid();
wireSeg("segSize","size",Number); wireSeg("segAI","ai",Number); wireSeg("segMode","mode",String); wireSeg("segWorld","world",String); wireSeg("segDiff","diff",String); wireSeg("segHumans","humans",Number);
el("btnStart").onclick=()=>{
  newGame({folklore:sel.folklore,size:sel.size,ai:sel.ai,mode:sel.mode,world:sel.world,diff:sel.diff,humans:sel.humans});
  startScreen.classList.remove("on"); el("mClose").style.display="";
  renderHUD(); renderActions(); save();
  toast("Your folklore is founded. Explore!");
  // §2 randomized order: seat 0 may be a CPU or the second human
  const first=G.players[0];
  if(!first.human){ setTimeout(()=>{ aiTurn(0); if(!G.over) advancePlayer(); },300); }
  else { G.viewer=0; if(multiHuman()) showCurtain(0); renderHUD(); }
};
el("curtainGo").onclick=()=>{
  el("curtain").classList.remove("on");
  centerCameraOn(capitalOf(G.current));
  renderHUD(); renderActions();
};
el("btnContinue").onclick=()=>{ if(loadSave()){ el("mClose").style.display=""; } };
if(hasSave()) el("btnContinue").style.display="block";

// keyboard: Enter/Space = end turn, Esc = deselect
addEventListener("keydown",e=>{
  if(startScreen.classList.contains("on")||el("scrim").classList.contains("on")||el("curtain").classList.contains("on")) return;
  if(e.key===" "||e.key==="Enter"){ if(isHumanTurn())endTurn(); }
  else if(e.key==="Escape") clearSel();
});
